# ngrok Traffic Policy for reaching the Blockbench MCP server through a tunnel.
# It uses only actions that ngrok's free plan accepts.
#
# 1. Copy this file to ngrok-policy.yml in the repository root (git ignores that name).
# 2. Replace REPLACE_WITH_SECRET with a long random value.
# 3. If you changed the plugin's port, update the host value too.
on_http_request:
  # Requests without the exact secret are refused before they reach Blockbench.
  - expressions:
      - "req.url.query != 'key=REPLACE_WITH_SECRET'"
    actions:
      - type: deny
        config:
          status_code: 404
  # The plugin rejects unexpected hosts, so requests with the secret are given the local one.
  - actions:
      - type: add-headers
        config:
          headers:
            host: "127.0.0.1:3939"
